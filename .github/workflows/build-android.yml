name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tag comes from build.gradle.kts so a version bump is the only edit needed
      # (a hardcoded tag once shipped a new build onto an old release).
      - name: Read keyboard version
        id: kb_version
        run: echo "version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/keyboard/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x app/gradlew

      - name: Run keyboard unit tests
        run: cd app && ./gradlew :keyboard:test

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release/zakhrafa-upload-key.jks

      - name: Build AAB
        run: cd app && ./gradlew :keyboard:bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build APK
        run: cd app && ./gradlew :keyboard:assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: zakhrafa-keyboard-aab
          path: app/keyboard/build/outputs/bundle/release/*.aab
          retention-days: 5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zakhrafa-keyboard-apk
          path: app/keyboard/build/outputs/apk/release/*.apk
          retention-days: 5

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-v${{ steps.kb_version.outputs.version }}
          name: Zakhrafa Keyboard ${{ steps.kb_version.outputs.version }}
          files: |
            app/keyboard/build/outputs/bundle/release/*.aab
            app/keyboard/build/outputs/apk/release/*.apk
          generate_release_notes: true
