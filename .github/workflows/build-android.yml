name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x app/gradlew

      - name: Build AAB
        run: cd app && ./gradlew :keyboard:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: zakhrafa-keyboard-aab
          path: app/keyboard/build/outputs/bundle/release/*.aab
          retention-days: 5

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-v5.9
          name: Zakhrafa Keyboard 5.9
          files: app/keyboard/build/outputs/bundle/release/*.aab
          generate_release_notes: true
