name: Build Zakhrafa App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 build packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode upload key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release/zakhrafa-upload-key.jks

      - name: Build release APK and Play bundle
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
        working-directory: app
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare direct download files
        run: |
          cp app/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Zakhrafa-1.8.4.apk"
          cp app/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/Zakhrafa-1.8.4.aab"

      - name: Publish direct APK and AAB downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zakhrafa-app-v1.8.4-${{ github.run_number }}
          name: Zakhrafa App 1.8.4 (Build ${{ github.run_number }})
          make_latest: false
          generate_release_notes: false
          files: |
            ${{ runner.temp }}/Zakhrafa-1.8.4.apk
            ${{ runner.temp }}/Zakhrafa-1.8.4.aab
